server {
    listen 80;
    server_name quasar-x.ru www.quasar-x.ru;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8443 ssl;
    server_name quasar-x.ru www.quasar-x.ru;
    ssl_certificate /etc/letsencrypt/live/quasar-x.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quasar-x.ru/privkey.pem;
    location / {
        root /var/www/quasar_landing;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name admin.quasar-x.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    include snippets/security-headers.conf;
    server_name admin.quasar-x.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.quasar-x.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.quasar-x.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        limit_req zone=admin_zone burst=30 nodelay;
        limit_req_status 429;
        root /var/www/admin;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

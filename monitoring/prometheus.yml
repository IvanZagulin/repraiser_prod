global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    server: '89-23-118-245'

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'postgres_repricer'
    static_configs:
      - targets: ['postgres_exporter_repricer:9187']
        labels: { app: repricer }

  - job_name: 'postgres_ai_ads'
    static_configs:
      - targets: ['postgres_exporter_ai_ads:9187']
        labels: { app: ai_ads }

  - job_name: 'redis_repricer'
    static_configs:
      - targets: ['redis_exporter_repricer:9121']
        labels: { app: repricer }

  - job_name: 'redis_ai_ads'
    static_configs:
      - targets: ['redis_exporter_ai_ads:9121']
        labels: { app: ai_ads }

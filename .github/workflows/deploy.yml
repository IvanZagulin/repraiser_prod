name: Deploy to Production

on:
  # ?????????????????????? ?????????????????????????? ???????????? ?????????? ?????????????????? CI ???? ?????????? main
  workflow_run:
    workflows: ["CI - Lint & Test"]
    types: [completed]
    branches: [main]
  # ???????????? ???????????? (???????????????? ???????? ???????????? ???????????????????????? ?????? ??????????????????)
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # ?????????????? ???????????? ????????:
    # - ???????????? ???????????? (workflow_dispatch)
    # - ?????? CI ???????????????????? ?????????????? ???? ?????????? main
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Load SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        env:
          H: ${{ secrets.SERVER_HOST }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          ssh-keyscan -H "$CLEAN_H" >> ~/.ssh/known_hosts

      - name: Fix git permissions
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          ssh "${CLEAN_U}@${CLEAN_H}" 'cd ~/repraiser_prod/repraiser_prod && sudo chown -R $(whoami):$(id -gn) .git/ 2>/dev/null || chmod -R u+rwX .git/ 2>/dev/null || true'

      - name: Deploy
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          ssh "${CLEAN_U}@${CLEAN_H}" 'cd ~/repraiser_prod/repraiser_prod && bash deploy.sh'

      - name: Verify
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          STATUS=$(ssh "${CLEAN_U}@${CLEAN_H}" \
            'docker inspect --format="{{.State.Health.Status}}" wb_repricer_backend_prod 2>/dev/null')
          echo "Backend status: $STATUS"
          [ "$STATUS" = "healthy" ] && echo "Deploy successful!" || exit 1

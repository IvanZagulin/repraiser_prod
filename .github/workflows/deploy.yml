name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scheduler/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "deploy.sh"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'cd ~/repraiser_prod/repraiser_prod && bash deploy.sh'

      - name: Verify
        run: |
          STATUS=$(ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'docker inspect --format="{{.State.Health.Status}}" wb_repricer_backend_prod 2>/dev/null')
          echo "Backend status: $STATUS"
          [ "$STATUS" = "healthy" ] && echo "Deploy successful!" || exit 1

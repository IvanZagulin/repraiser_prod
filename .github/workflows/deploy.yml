name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI - Lint & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Load SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        env:
          H: ${{ secrets.SERVER_HOST }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          ssh-keyscan -H "$CLEAN_H" >> ~/.ssh/known_hosts

      - name: Wait for Celery
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          ssh "${CLEAN_U}@${CLEAN_H}" 'bash -s' <<'EOF'
          cd ~/repraiser_prod/repraiser_prod
          echo "[deploy] Checking repricer activity..."
          MAX_WAIT=300; WAITED=0
          while true; do
            if docker exec wb_repricer_celery celery -A app.celery_app inspect active 2>/dev/null | grep -q "repricer.run_for_user"; then
              ACTIVE_REPRICER="1"
            else
              ACTIVE_REPRICER="0"
            fi

            RUNNING_DB=$(docker exec wb_repricer_backend_prod python -c 'from app.database import SessionLocal; from app.models import RepricerRun; s=SessionLocal(); print(s.query(RepricerRun).filter(RepricerRun.status == "running").count()); s.close()' 2>/dev/null || echo unknown)

            if [ "$ACTIVE_REPRICER" = "0" ] && [ "$RUNNING_DB" = "0" ]; then
              echo "[deploy] Repricer idle"
              break
            fi
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "[deploy] ERROR: repricer still active after ${MAX_WAIT}s (celery=${ACTIVE_REPRICER}, db_running=${RUNNING_DB}); aborting deploy"
              exit 1
            fi
            echo "[deploy] Repricer busy (celery=${ACTIVE_REPRICER}, db_running=${RUNNING_DB}), waiting... (${WAITED}/${MAX_WAIT}s)"
            sleep 15
            WAITED=$((WAITED + 15))
          done
          EOF

      - name: Update source code
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          REMOTE="${CLEAN_U}@${CLEAN_H}"
          DIR="~/repraiser_prod/repraiser_prod"

          # Try git pull first
          if ssh "$REMOTE" "cd $DIR && sudo -n chown -R \$(whoami):\$(id -gn) .git/ 2>/dev/null; git pull origin main" 2>&1; then
            echo "git pull OK ✓"
          else
            echo "git pull failed — streaming archive from GitHub via runner..."
            curl -sL -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GH_REPO}/tarball/main" \
              | ssh "$REMOTE" "cd $DIR && tar xz --strip-components=1"
            echo "Archive extracted ✓"
          fi

      - name: Build and deploy
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          ssh "${CLEAN_U}@${CLEAN_H}" 'bash -s' <<'EOF'
          set -e
          cd ~/repraiser_prod/repraiser_prod
          APP_SERVICES="backend celery_worker scheduler flower frontend"

          find ./backend -name '*.pyc' -delete 2>/dev/null || true
          find ./backend -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true

          echo "[deploy] Building frontend (no cache — ensures fresh JS bundle)..."
          docker compose build --no-cache frontend

          echo "[deploy] Building remaining app images..."
          docker compose build backend celery_worker scheduler flower

          echo "[deploy] Running DB migrations..."
          docker compose run -T --rm --no-deps backend alembic upgrade head </dev/null

          echo "[deploy] Importing WB subject commissions..."
          docker compose run -T --rm --no-deps backend python -m app.scripts.import_wb_subject_commissions </dev/null

          echo "[deploy] Recreating app services..."
          docker compose up -d --no-deps --force-recreate $APP_SERVICES

          echo "[deploy] Waiting for backend health check..."
          timeout 90 bash -c 'until docker inspect --format="{{.State.Health.Status}}" wb_repricer_backend_prod 2>/dev/null | grep -q healthy; do sleep 3; done' \
            && echo "[deploy] Backend healthy ✓" \
            || echo "[deploy] WARNING: Backend health check timed out"

          echo "[deploy] Queueing WB catalog sync for subject refresh..."
          docker compose exec -T backend python -c "from app.tasks.catalog_sync import sync_all_wb_catalogs_task; task = sync_all_wb_catalogs_task.delay(); print(f'[deploy] catalog.sync_all queued: {task.id}')"

          echo "[deploy] Done. Running containers:"
          docker compose ps --format 'table {{.Name}}\t{{.Status}}'
          EOF

      - name: Verify
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          STATUS=$(ssh "${CLEAN_U}@${CLEAN_H}" \
            'docker inspect --format="{{.State.Health.Status}}" wb_repricer_backend_prod 2>/dev/null')
          echo "Backend status: $STATUS"
          [ "$STATUS" = "healthy" ] && echo "Deploy successful!" || exit 1

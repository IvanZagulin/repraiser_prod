name: Server Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        env:
          H: ${{ secrets.SERVER_HOST }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          ssh-keyscan -H "$CLEAN_H" >> ~/.ssh/known_hosts

      - name: Run diagnostics
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          ssh "${CLEAN_U}@${CLEAN_H}" 'bash -s' <<'EOF'
          cd ~/repraiser_prod/repraiser_prod

          echo "===== SCHEDULER LOGS (last 80 lines) ====="
          docker logs wb_repricer_scheduler_prod --tail 80 2>&1

          echo ""
          echo "===== DB: Last 15 repricer_runs ====="
          docker exec wb_repricer_db_prod psql -U postgres -d wb_repricer -c "
            SELECT id, user_id, run_type, status,
                   started_at AT TIME ZONE 'Europe/Moscow' as started_msk,
                   completed_at AT TIME ZONE 'Europe/Moscow' as completed_msk,
                   total_products, updated_count, skipped_count, error_count,
                   substring(error_message from 1 for 80) as error_msg
            FROM repricer_runs
            ORDER BY started_at DESC
            LIMIT 15;
          "

          echo ""
          echo "===== DB: price_changes columns ====="
          docker exec wb_repricer_db_prod psql -U postgres -d wb_repricer -c "
            SELECT column_name, data_type FROM information_schema.columns
            WHERE table_name = 'price_changes' ORDER BY ordinal_position;
          "

          echo ""
          echo "===== DB: Last 15 price_changes ====="
          docker exec wb_repricer_db_prod psql -U postgres -d wb_repricer -c "
            SELECT id, product_id, reason,
                   changed_at AT TIME ZONE 'Europe/Moscow' as changed_msk
            FROM price_changes
            ORDER BY changed_at DESC
            LIMIT 15;
          "

          echo ""
          echo "===== DB: price_changes count by date (last 5 days) ====="
          docker exec wb_repricer_db_prod psql -U postgres -d wb_repricer -c "
            SELECT (changed_at AT TIME ZONE 'Europe/Moscow')::date as day,
                   count(*) as total,
                   count(*) filter (where reason = 'UPDATED') as updated,
                   count(*) filter (where reason = 'CLAMPED_TO_MIN') as clamped_min,
                   count(*) filter (where reason = 'CLAMPED_TO_MAX') as clamped_max
            FROM price_changes
            WHERE changed_at > NOW() - INTERVAL '5 days'
            GROUP BY day ORDER BY day DESC;
          "

          echo ""
          echo "===== CELERY ERROR LOGS (last 20 errors) ====="
          docker logs wb_repricer_celery 2>&1 | grep -i "error\|ERROR\|fail\|FAIL\|400\|429\|Upload limit" | tail -20
          EOF

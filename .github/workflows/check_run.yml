name: Quick check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Setup
        env:
          H: ${{ secrets.SERVER_HOST }}
        run: ssh-keyscan -H "$(printf '%s' "$H" | tr -d '[:space:]')" >> ~/.ssh/known_hosts
      - name: Manual run
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          R="${U}@$(printf '%s' "$H" | tr -d '[:space:]')"

          echo "=== Triggering manual run for user 12 ==="
          ssh "$R" 'docker exec wb_repricer_backend_prod python -c "
from app.tasks.repricer_task import run_repricer_for_user
from app.database import SessionLocal
from sqlalchemy import text
db = SessionLocal()
rows = db.execute(text(\"\"\"
    SELECT p.id FROM products p
    JOIN accounts a ON p.account_id = a.id
    JOIN product_config pc ON pc.product_id = p.id
    WHERE a.user_id = 12 AND a.is_active = TRUE AND pc.is_active = TRUE
\"\"\")).fetchall()
db.close()
pids = [r[0] for r in rows]
print(f\"Products: {len(pids)}\")
task = run_repricer_for_user.delay(12, pids, \"manual\")
print(f\"Task ID: {task.id}\")
"'

          echo ""
          echo "=== Waiting 10s for task to start ==="
          sleep 10

          echo ""
          echo "=== Last 3 runs ==="
          ssh "$R" "docker exec wb_repricer_db_prod psql -U postgres -d wb_repricer -c \"SELECT id, status, run_type, started_at, total_products, updated_count FROM repricer_runs ORDER BY id DESC LIMIT 3;\""

          echo ""
          echo "=== Celery active ==="
          ssh "$R" "docker exec wb_repricer_celery celery -A app.celery_app inspect active 2>/dev/null | head -10 || echo 'no response'"

name: Quick check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Setup
        env:
          H: ${{ secrets.SERVER_HOST }}
        run: ssh-keyscan -H "$(printf '%s' "$H" | tr -d '[:space:]')" >> ~/.ssh/known_hosts
      - name: Fix and check
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          R="${U}@$(printf '%s' "$H" | tr -d '[:space:]')"
          echo "=== Mark stuck runs as failed ==="
          ssh "$R" "docker exec wb_repricer_db_prod psql -U postgres -d wb_repricer -c \"UPDATE repricer_runs SET status='failed', error_message='Interrupted by container restart', completed_at=NOW() WHERE status='running' AND started_at < NOW() - INTERVAL '5 minutes';\""
          echo ""
          echo "=== Last 5 runs ==="
          ssh "$R" "docker exec wb_repricer_db_prod psql -U postgres -d wb_repricer -c \"SELECT id, status, run_type, started_at, completed_at, total_products, updated_count, skipped_count FROM repricer_runs ORDER BY id DESC LIMIT 5;\""
          echo ""
          echo "=== Scheduler last 20 lines ==="
          ssh "$R" "docker logs --tail 20 wb_repricer_scheduler_prod 2>&1"
          echo ""
          echo "=== Celery active ==="
          ssh "$R" "docker exec wb_repricer_celery celery -A app.celery_app inspect active 2>/dev/null | head -15 || echo 'no response'"

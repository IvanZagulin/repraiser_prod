name: Force restart containers
on: workflow_dispatch

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add known hosts
        env:
          H: ${{ secrets.SERVER_HOST }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          ssh-keyscan -H "$CLEAN_H" >> ~/.ssh/known_hosts

      - name: Restart all app containers
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
        run: |
          CLEAN_H=$(printf '%s' "$H" | tr -d '[:space:]"'"'"'')
          CLEAN_U=$(printf '%s' "$U" | tr -d '[:space:]"'"'"'')
          REMOTE="${CLEAN_U}@${CLEAN_H}"

          echo "=== Recreating app containers ==="
          ssh "$REMOTE" "cd ~/repraiser_prod/repraiser_prod && docker compose up -d --no-deps --force-recreate backend celery_worker scheduler flower frontend"

          echo ""
          echo "=== Waiting for backend health ==="
          ssh "$REMOTE" "timeout 90 bash -c 'until docker inspect --format={{.State.Health.Status}} wb_repricer_backend_prod 2>/dev/null | grep -q healthy; do sleep 3; done' && echo 'Backend healthy' || echo 'Health check timed out'"

          echo ""
          echo "=== Container status ==="
          ssh "$REMOTE" "cd ~/repraiser_prod/repraiser_prod && docker compose ps --format 'table {{.Name}}\t{{.Status}}'"

          echo ""
          echo "=== Scheduler startup logs ==="
          ssh "$REMOTE" "sleep 8 && docker logs --tail 15 wb_repricer_scheduler_prod 2>&1"
